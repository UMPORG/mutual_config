name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Instalar ferramentas (versões de versoes.json)
        run: >-
          npm install --no-save --no-package-lock
          typescript@7.0.2 @types/node@24.19.2 @types/react@19.3.0 @types/bun@1.4.3
          oxlint@1.88.0 oxfmt@0.73.0 knip@6.41.0

      - name: JSON válido, extends e versões coerentes
        run: node scripts/validar.mjs

      - name: tsconfig (next + estrito, bun)
        run: |
          npx tsc -p testes/next --noEmit
          npx tsc -p testes/bun --noEmit
          npx tsc -p testes/vite --noEmit

      - name: oxlint (preset next)
        run: npx oxlint -c oxlint/next.json scripts testes

      - name: oxfmt (.oxfmtrc.json = cópia de oxfmt/base.json)
        run: npx oxfmt --check .

      - name: Renovate (preset)
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict renovate/default.json default.json

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks (aviso, não falha o CI)
        env:
          GITLEAKS_VERSION: 8.30.1
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          DEPOIS: ${{ github.sha }}
        run: |
          set -eu
          ficheiro="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "$base/$ficheiro"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $ficheiro\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$ficheiro" gitleaks
          if [ "$EVENTO" = "pull_request" ]; then
            intervalo="$BASE_PR..$DEPOIS"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            intervalo="$ANTES..$DEPOIS"
          else
            intervalo="$DEPOIS"
          fi
          ./gitleaks git --redact --exit-code 0 --log-opts="$intervalo" .
